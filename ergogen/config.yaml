meta:
  engine: 4.2.0

units:
  # promicro/nice nano size
  px: 18
  py: 33

  kx: 15
  ky: 15

  skt: 19.05

points:
  zones:
    matrix:
      anchor.shift: [50,-100]
      columns:
        pinky:
          key:
            splay: 8
            origin: [0, -17]
            column_net: C0
        ring:
          key:
            stagger: 0.66cy
            splay: -4
            origin: [0, -17]
            column_net: C1
        middle:
          key:
            stagger: 0.25cy
            splay: -4
            origin: [0, -17]
            column_net: C2
        index:
          key:
            stagger: -0.25cy
            origin: [0, -17]
            column_net: C3
        inner:
          key:
            stagger: -0.1cy
            origin: [0, -17]
            column_net: C4
      rows:
        bottom:
          row_net: R2
        home:
          row_net: R1
        top:
          row_net: R0
      key:
        padding: cy
        spread: cx
        width: cx
        height: cy
        tags: 
          - key
        nets:
          colrow: "{{column_net}}_{{row_net}}"
    thumb:
      anchor:
        ref: matrix_index_bottom
        shift: [0.66cx, -1.25cy]
      columns:
        first:
          key:
            splay: -10
            column_net: C4
        second:
          key:
            splay: -15
            origin: [-9, -9.5]
            column_net: C5
      rows:
        only:
          row_net: R3
      key:
        padding: cy
        spread: cx
        width: cx
        height: cy
        tags: 
          - key
        nets:
          colrow: "{{column_net}}_{{row_net}}"

    mcu: &mcu
      anchor:
        ref.aggregate.parts: [matrix_inner_home, matrix_inner_bottom]
        shift: [0.5cx + 10.5, 0]
      key:
        tags:
          - mcu
        height: 0
        width: 0

    intercept: &intercept
      anchor:
        aggregate:
          method: intersect
          parts:
            - ref: thumb_second_only
              shift: [0.5kx, 0.5ky]
            - ref: [mcu]
              shift: [0.5px-0.5, -0.5py]
      key:
        tags:
          - intercept
        height: 0
        width: 0

    intercept2: &intercept2
      anchor:
        aggregate:
          method: intersect
          parts:
            - ref: [mcu]
              shift: [-0.5px, 0.5py+0.3]
              rotate: 90
            - ref: matrix_inner_top
              shift: [0.5kx, 0.5ky]
      key:
        tags:
          - intercept2
        height: 0
        width: 0

    tenting_puck: &tent
      anchor:
        ref: matrix_index_home
        shift: [-0.5cx+0.5, 0.5cy-2]
      key:
        tags:
          - tent
        height: 0
        width: 0
    
    screw_top: &screws
      anchor:
        ref: [tenting_puck]
        shift: [0, skt]
      key:
        tags:
          - screws
        height: 0
        width: 0
    screw_left:
      <<: *screws
      anchor:
        ref: [tenting_puck]
        shift: [-skt, 0]
    screw_bottom:
      <<: *screws
      anchor:
        ref: [tenting_puck]
        shift: [0, -skt]
    screw_right:
      <<: *screws
      anchor:
        ref: [tenting_puck]
        shift: [skt, 0]
    
    non_slip_top_left: &non_slip
      anchor:
        ref: matrix_pinky_top
        shift: [-0.25kx, 0.25cy]
      key:
        tags:
          - non_slip
        height: 0
        width: 0
    non_slip_top_middle:
      <<: *non_slip
      anchor:
        ref: matrix_middle_top
        shift: [0, 0.25cy]
    non_slip_top_right: 
      <<: *non_slip
      anchor:
        ref: matrix_inner_top
        shift: [0.25kx, 0.25cy]
    non_slip_mcu:
      <<: *non_slip
      anchor:
        ref: [mcu]
        shift: [0.5px-0.25cx, 0.5py-0.25cy]
    non_slip_bottom_right: 
      <<: *non_slip
      anchor:
        ref: thumb_second_only
        shift: [0.25kx, -0.25ky]
    non_slip_bottom_middle:
      <<: *non_slip 
      anchor:
        ref: matrix_middle_bottom
        shift: [0, -0.5cy-15]
    non_slip_bottom_left:
      <<: *non_slip
      anchor:
        ref: matrix_pinky_bottom
        shift: [-0.25kx, -0.25ky]

outlines:
  _raw:
    - what: rectangle
      where: [key]
      size: [cx, cy]
  _pcb:
    - what: path
      segments:
        - type: arc
          points:
            - ref: matrix_pinky_top
              shift: [-0.5kx, 0.5cy]
            - ref: matrix_ring_top
              shift: [-0.5kx, 0.5ky]
            - ref: matrix_inner_top
              shift: [0.5kx, 0.5cy]
        - type: line
          points:
            - ref: [intercept2]
        - type: line
          points:
            - ref: [mcu]
              shift: [0.5px-0.5, 0.5py+0.3]
        - type: line
          points:
            - ref: [intercept]
        - type: line
          points:
            - ref: thumb_second_only
              shift: [0.5kx, -0.5ky]
        - type: arc
          points:
            - ref: thumb_first_only
              shift: [-0.5kx, -0.5ky]
            - ref: matrix_pinky_bottom
              shift: [-0.5kx, -0.5ky]
        - type: line
          points:
            - ref: matrix_pinky_top
              shift: [-0.5kx, 0.5ky]
      expand: 0.5
      fillet: 1
  _base:
    - name: _pcb
      expand: 0.2
  _wall:
    - name: _base
      expand: 1.6
    - operation: subtract
      name: _base
  _heat_inserts:
    - what: circle
      where: [screws]
      radius: 2.5
  _heat_inserts_negative:
    - what: circle
      where: [screws]
      radius: 1.5
  _non_slip:
    - what: circle
      where: [non_slip]
      radius: 4.1
pcbs:
  simple34_v2:
    template: kicad8
    outlines.name.outline: _pcb
    footprints:
      mcu:
        what: ceoloide/mcu_supermini_nrf52840
        where: [mcu]
        params:
          reverse_mount: true
          reversible: true
          show_instructions: false
          show_silk_labels: false
          show_via_labels: true
          mcu_3dmodel_filename: ${SCOTTOKEEBS_KICAD}/3dmodels/ScottoKeebs_MCU.3dshapes/Nice_Nano_V2_Flipped.step
          mcu_3dmodel_xyz_offset: [0, 0, 6]
          P21: C0
          P20: C1
          P19: C2
          P18: C3
          P15: C4
          P14: C5
          P9: R3
          P8: R2
          P7: R1
          P6: R0
          P3: led_1
          P4: led_2
          P5: led_3
      diode:
        what: ceoloide/diode_tht_sod123
        where: [key]
        params:
          reversible: true
          include_thru_hole_smd_pads: true
          from: "{{colrow}}"
          to: "{{row_net}}"
          diode_3dmodel_filename: ${KICAD9_3DMODEL_DIR}/Diode_SMD.3dshapes/D_SOD-123.step
          diode_3dmodel_xyz_offset: [0, 0, -1.6]
          diode_3dmodel_xyz_rotation: [0, 180, 180]
        adjust:
          shift: [0, 4.7]
          rotate: 180
      choc_solder:
        what: ceoloide/switch_choc_v1_v2
        where: [key]
        params:
          from: "{{column_net}}"
          to: "{{colrow}}"
          include_corner_marks: true
          keycap_height: 16.5
          keycap_width: 17.5
          reversible: true
          hotswap: false
          solder: true
          choc_v2_support: false
          switch_3dmodel_filename: ${KICAD9_3RD_PARTY}/3dmodels/com_github_perigoso_keyswitch-kicad-library/3d-library.3dshapes/SW_Kailh_Choc_V1.stp
          switch_3dmodel_xyz_offset: [0, 0, -1.6]
          switch_3dmodel_xyz_rotation: [0, 180, 180]
          keycap_3dmodel_filename: ${KIPRJMOD}/../../models/MBK_Keycap_-_1u.step
          keycap_3dmodel_xyz_offset: [0, 0, -8.5]
          keycap_3dmodel_xyz_rotation: [0, 180, 0]
        adjust.rotate: 180
      tenting_puck:
        what: splitkb/tenting_puck
        where: [tenting_puck]
      power_switch:
        what: ceoloide/power_switch_smd_side
        where: [mcu]
        params:
          reversible: true
          include_silkscreen: false
          from: BAT_P
          to: RAW
          switch_3dmodel_filename: ${SCOTTOKEEBS_KICAD}/3dmodels/ScottoKeebs_Components.3dshapes/Switch_MSK12C02.step
          switch_3dmodel_xyz_rotation: [0, 0, 90]
        adjust:
          shift: [0, 0.5py-1.5]
          rotate: 90
      reset:
        what: terence/reset_tht
        where: [mcu]
        params:
          reversible: true
          switch_3dmodel_filename: ${KICAD9_3DMODEL_DIR}/Button_Switch_SMD.3dshapes/SW_SPST_TS-1088-xR020.step
        adjust:
          shift: [-0.5px-2, -0.5py-3]
          rotate: 90
      led_1:
        what: terence/led_5mm_tht
        where: [mcu]
        params:
          reversible: true
          anode: led_1
          cathode: r1
          led_3dmodel_filename: ${KICAD9_3DMODEL_DIR}/LED_THT.3dshapes/LED_D5.0mm_Green.step
          led_3dmodel_xyz_offset: [-1.3, 0, -3]
        adjust:
          shift: [5.5, -0.5py-3]
      led_2:
        what: terence/led_5mm_tht
        where: [mcu]
        params:
          reversible: true
          anode: led_2
          cathode: r2
          led_3dmodel_filename: ${KICAD9_3DMODEL_DIR}/LED_THT.3dshapes/LED_D5.0mm_Green.step
          led_3dmodel_xyz_offset: [-1.3, 0, -3]
        adjust:
          shift: [0, -0.5py-3]
      led_3:
        what: terence/led_5mm_tht
        where: [mcu]
        params:
          reversible: true
          anode: led_3
          cathode: r3
          led_3dmodel_filename: ${KICAD9_3DMODEL_DIR}/LED_THT.3dshapes/LED_D5.0mm_Green.step
          led_3dmodel_xyz_offset: [-1.3, 0, -3]
        adjust:
          shift: [-5.5, -0.5py-3]
      led_1_resistor:
        what: terence/resistor_1206
        where: [mcu]
        params:
          reversible: true
          from: r1
          to: GND
          resistor_3dmodel_filename: ${KICAD9_3DMODEL_DIR}/Resistor_SMD.3dshapes/R_1206_3216Metric.step
        adjust:
          shift: [3, -0.5py-9]
          rotate: 270
      led_2_resistor:
        what: terence/resistor_1206
        where: [mcu]
        params:
          reversible: true
          from: r2
          to: GND
          resistor_3dmodel_filename: ${KICAD9_3DMODEL_DIR}/Resistor_SMD.3dshapes/R_1206_3216Metric.step
        adjust:
          shift: [0, -0.5py-9]
          rotate: 270
      led_3_resistor:
        what: terence/resistor_1206
        where: [mcu]
        params:
          reversible: true
          from: r3
          to: GND
          resistor_3dmodel_filename: ${KICAD9_3DMODEL_DIR}/Resistor_SMD.3dshapes/R_1206_3216Metric.step
        adjust:
          shift: [-3, -0.5py-9]
          rotate: 270
      battery:
        what: terence/battery_socket_tht
        where: [mcu]
        params:
          reversible: true
          BAT_P: BAT_P
          BAT_N: GND
        adjust:
          shift: [0, 0.5py-1.5]
cases:
  left:
    - name: _wall
      extrude: 5.6
      fillet.outer: [1, 0.5]
    - name: _base 
      extrude: 2
    - name: _heat_inserts
      extrude: 2
      shift: [0, 0, 2]
    - operation: subtract
      name: _non_slip
      extrude: 1
    - operation: subtract
      name: _heat_inserts_negative
      extrude: 3
      shift: [0, 0, 1.2]
  _right:
    - name: _wall
      extrude: 5.6
      fillet.outer: [0.5, 1]
    - name: _base
      extrude: 2
      shift: [0, 0, 3.6]
    - name: _heat_inserts
      extrude: 2
      shift: [0, 0, 1.6]
    - operation: subtract
      name: _non_slip
      extrude: 1
      shift: [0, 0, 4.6]
    - operation: subtract
      name: _heat_inserts_negative
      extrude: 3
      shift: [0, 0, 1.4]
  right:
    - what: case
      name: _right
      rotate: [0, 180, 0]
